<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

{% seo %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
{% if site.favicon_image != "" %}
<link rel="icon" href="{{ site.favicon_image | relative_url }}">
{% else %}
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='%232dd4bf'/><text x='50' y='68' font-size='58' font-family='Arial' font-weight='700' fill='%2306201d' text-anchor='middle'>{{ site.author | slice: 0, 1 | upcase }}</text></svg>">
{% endif %}
