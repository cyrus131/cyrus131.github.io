# ------------------------------------------------
# Site settings — edit these to personalize your blog
# ------------------------------------------------
title: "Cyrus"
tagline: "Reverse Engineering & Malware Analysis notes"
description: >-
  Bài viết phân tích reverse engineering, malware, ransomware và CTF writeups.
author: "Cyrus"
author_bio: ""

url: "https://cyrus131.github.io"
baseurl: ""

# ------------------------------------------------
# Sidebar — social links (để trống để ẩn link tương ứng)
# ------------------------------------------------
email: ""
twitter_username: ""
linkedin_username: "cuongdq13"
github_username: cyrus131
coffee_url: ""

# Ảnh avatar tuỳ chọn, ví dụ: /assets/images/avatar.jpg
# Nếu để trống, sidebar sẽ hiện avatar chữ cái đầu tự sinh.
avatar_image: ""

# Favicon tuỳ chọn, ví dụ: /assets/images/favicon.png
# Nếu để trống, favicon sẽ tự sinh theo chữ cái đầu của "author" (đồng bộ màu với avatar).
favicon_image: ""

# ------------------------------------------------
# Navbar — danh mục chính hiển thị trên top nav
# slug phải khớp với category dùng trong front matter của bài viết
# ------------------------------------------------
nav_categories:
  - name: "Malware Analysis"
    slug: "malware-analysis"
  - name: "Binary Exploitation"
    slug: "binary-exploitation"
  - name: "CTF Writeups"
    slug: "ctf-writeups"
  - name: "Tutorials"
    slug: "tutorials"

# ------------------------------------------------
# Build settings
# ------------------------------------------------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

kramdown:
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

paginate: 8
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .github
